name: Weekly Issue 3 browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/weekly/**'
      - 'lib/weekly-briefs.ts'
      - 'app/globals.css'
      - 'app/sitemap.ts'
      - 'public/images/weekly/**'
      - 'scripts/test-weekly-issue.mjs'
      - '.github/workflows/weekly-issue-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Install Chrome browser test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Launch local site
        run: |
          npm run dev > /tmp/decodista-weekly-preview.log 2>&1 &
          for i in $(seq 1 35); do
            if curl --connect-timeout 2 --max-time 4 -fsS http://localhost:5173/ -o /dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/decodista-weekly-preview.log
          exit 1
      - name: Check weekly issue at four screen widths
        run: node scripts/test-weekly-issue.mjs
      - name: Save preview log
        if: always()
        run: |
          mkdir -p artifacts/weekly-issue-qa
          cp /tmp/decodista-weekly-preview.log artifacts/weekly-issue-qa/server.log 2>/dev/null || true
      - name: Upload QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-issue-qa
          path: artifacts/weekly-issue-qa/
          retention-days: 3
