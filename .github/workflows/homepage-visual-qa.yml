name: Homepage visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'app/search/page.tsx'
      - 'components/search-client.tsx'
      - 'lib/search.mjs'
      - 'scripts/test-search.mjs'
      - 'app/how-to/page.tsx'
      - 'lib/legal.ts'
      - 'lib/site.ts'
      - 'components/site-header.tsx'
      - 'components/site-footer.tsx'
      - 'scripts/check-production-deployment.mjs'
      - 'app/globals.css'
      - 'scripts/test-homepage-visual.mjs'
      - 'scripts/audit-mobile-performance.mjs'
      - 'components/article-card.tsx'
      - 'components/responsive-image.tsx'
      - 'build/responsive-images-vite-plugin.ts'
      - 'lib/responsive-images.generated.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-responsive-images.mjs'
      - '.github/workflows/homepage-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Launch local DECODISTA preview
        run: |
          npm run dev > /tmp/decodista-homepage-preview.log 2>&1 &
          echo $! > /tmp/decodista-homepage-preview.pid
          for i in $(seq 1 35); do
            if curl --connect-timeout 2 --max-time 4 -fsS http://localhost:5173/ -o /dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/decodista-homepage-preview.log
          exit 1
      - name: Verify generated image assets and srcset dimensions
        run: node scripts/test-responsive-images.mjs
      - name: Check homepage using Chrome
        run: node scripts/test-homepage-visual.mjs
      - name: Capture synthetic mobile performance baseline
        run: node scripts/audit-mobile-performance.mjs
      - name: Save screenshots, report and preview log
        if: always()
        run: |
          mkdir -p artifacts/homepage-qa
          cp /tmp/decodista-homepage-preview.log artifacts/homepage-qa/server.log 2>/dev/null || true
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-qa
          path: artifacts/homepage-qa/
          if-no-files-found: ignore
          retention-days: 3
