name: Release checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Validate, test, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate and commit security lockfile (temporary)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/release-check-pr'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: regenerate lockfile for Next.js 16.4.3"
            git push origin HEAD:ci/release-check-pr
          fi

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Run release checks
        run: npm run release:check
