name: Stage Google Account recovery editorial WebP

on:
  pull_request:
    branches: [main]
    paths:
      - 'artwork/article-heroes/recover-hacked-google-account-gmail.svg'
      - 'scripts/generate-article-heroes.mjs'
      - '.github/workflows/stage-google-recovery-artwork.yml'

permissions:
  contents: write

concurrency:
  group: stage-google-recovery-hero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-hero:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'editorial/google-account-recovery-guide-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Generate editorial hero
        run: node scripts/generate-article-heroes.mjs
      - name: Commit reviewed WebP to PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/uploads/recover-hacked-google-account-gmail.webp
          if git diff --cached --quiet; then
            echo "Hero WebP already versioned"
          else
            git commit -m "artwork: store Google Account recovery original WebP"
            git push origin "HEAD:editorial/google-account-recovery-guide-20261119"
          fi
