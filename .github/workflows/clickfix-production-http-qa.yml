name: ClickFix production HTTP smoke QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/clickfix-production-http-qa.yml'
      - 'scripts/verify-clickfix-production-http.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-article:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual live article, images and SEO over public HTTP
        run: node scripts/verify-clickfix-production-http.mjs
      - name: Upload external HTTP smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickfix-production-http-qa
          path: artifacts/clickfix-live-http-qa/
          if-no-files-found: warn
          retention-days: 7
