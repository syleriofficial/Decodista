name: ClickFix Security Draft QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/editorial-drafts/fake-captcha-scams-clickfix-malware.md'
      - 'docs/editorial-clickfix-release-qa.md'
      - 'scripts/qa-clickfix-draft.mjs'
      - '.github/workflows/clickfix-draft-qa.yml'
      - 'public/images/uploads/fake-captcha-scams-clickfix-malware.webp'
      - 'public/images/uploads/clickfix-real-vs-fake-captcha.webp'
      - 'public/images/uploads/clickfix-recovery-decision-flowchart.webp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate draft, sources, links and exact WebP hashes when present
        run: node scripts/qa-clickfix-draft.mjs
      - name: Upload scoped draft readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickfix-security-draft-qa
          path: artifacts/clickfix-draft-qa/
          retention-days: 14
          if-no-files-found: warn
